<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Motors</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #090d16; --panel: #111827; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #1f293d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -0.5px; }
        .admin-btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; font-weight: 700; border-radius: 6px; cursor: pointer; }
        .filters { display: flex; gap: 8px; margin: 25px 0; }
        .filter-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #1e293b; }
        .card-content { padding: 16px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
        .price { color: var(--accent); font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        .details { color: var(--muted); font-size: 0.85rem; margin-bottom: 15px; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
        .modal-body { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Northstar Motors</div>
        <button class="admin-btn" onclick="toggleModal()">⚙ Admin Panel</button>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
        <button class="filter-btn" onclick="setFilter('Trucks', this)">Trucks</button>
        <button class="filter-btn" onclick="setFilter('SUVs', this)">SUVs</button>
        <button class="filter-btn" onclick="setFilter('Performance', this)">Performance</button>
        <button class="filter-btn" onclick="setFilter('Luxury', this)">Luxury</button>
    </div>

    <div class="cards" id="inventory">Loading vehicles...</div>

    <div class="modal" id="adminModal">
        <div class="modal-body">
            <h3>Add Vehicle Listing</h3>
            <input type="text" id="vTitle" placeholder="Year Make Model (e.g. 2021 BMW X3)">
            <select id="vCategory">
                <option value="Trucks">Trucks</option>
                <option value="SUVs">SUVs</option>
                <option value="Performance">Performance</option>
                <option value="Luxury">Luxury</option>
            </select>
            <input type="text" id="vPrice" placeholder="Price ($)">
            <input type="text" id="vMileage" placeholder="Mileage (e.g. 42,000 mi)">
            <input type="text" id="vImage" placeholder="Image Link (URL)">
            <button class="admin-btn" onclick="addVehicle()">Save</button>
            <button class="filter-btn" onclick="toggleModal()">Cancel</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uzvopmfnytgtfapzwivv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SSTziJGXdh0gilPDHw5xag_PIawBNHw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let inventory = [];

        async function loadVehicles() {
            const { data, error } = await _supabase.from('vehicles').select('*').order('created_at', { ascending: false });
            if (error) {
                document.getElementById('inventory').innerHTML = '<p>Error loading data from Supabase.</p>';
            } else {
                inventory = data;
                render(inventory);
            }
        }

        function render(list) {
            const container = document.getElementById('inventory');
            if (!list || list.length === 0) {
                container.innerHTML = '<p style="color:var(--muted)">No vehicles listed yet. Click Admin Panel to add one.</p>';
                return;
            }
            container.innerHTML = list.map(item => `
                <div class="card">
                    <img src="${item.image || 'https://via.placeholder.com/400x250'}" alt="${item.title}">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="price">${item.price}</div>
                        <div class="details">${item.mileage || ''} • ${item.category}</div>
                        <button class="del-btn" onclick="deleteVehicle('${item.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function setFilter(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'All') render(inventory);
            else render(inventory.filter(i => i.category === cat));
        }

        function toggleModal() {
            const m = document.getElementById('adminModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        async function addVehicle() {
            const title = document.getElementById('vTitle').value;
            const category = document.getElementById('vCategory').value;
            const price = document.getElementById('vPrice').value;
            const mileage = document.getElementById('vMileage').value;
            const image = document.getElementById('vImage').value;

            if (!title) return alert('Vehicle title required.');

            const { error } = await _supabase.from('vehicles').insert([{ title, category, price, mileage, image }]);
            if (error) alert('Error: ' + error.message);
            else {
                toggleModal();
                loadVehicles();
            }
        }

        async function deleteVehicle(id) {
            if (confirm('Delete listing?')) {
                const { error } = await _supabase.from('vehicles').delete().eq('id', id);
                if (error) alert(error.message);
                else loadVehicles();
            }
        }

        loadVehicles();
    </script>
</body>
</html>
